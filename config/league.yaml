# GridironGM league configuration — single source of truth.
# Nothing in application logic may hard-code these values.

league:
  # Shared defaults. Per-league overrides live in `leagues:` at the bottom of
  # this file; scoring and roster rules below are shared by every league.
  name: "My ESPN League"
  platform: espn
  teams: 12             # default team count; each league may override
  season: 2026          # season being played/drafted for (global — all leagues)
  history_seasons: 3    # completed seasons of history to ingest for projections

scoring:
  # Half-PPR (ESPN default base scoring otherwise)
  passing:
    yards_per_point: 25        # 0.04 / yd
    touchdown: 4
    interception: -2
    two_point: 2
  rushing:
    yards_per_point: 10        # 0.1 / yd
    touchdown: 6
    two_point: 2
  receiving:
    reception: 0.5             # HALF-PPR
    yards_per_point: 10
    touchdown: 6
    two_point: 2
  misc:
    fumble_lost: -2
    return_touchdown: 6
  kicking:
    fg_0_39: 3
    fg_40_49: 4
    fg_50_plus: 5
    fg_missed: -1
    xp_made: 1
    xp_missed: -1
  dst:
    sack: 1
    interception: 2
    fumble_recovery: 2
    touchdown: 6
    safety: 2
    block_kick: 2
    points_allowed_tiers:      # [max_points_allowed, fantasy_points]
      - [0, 5]
      - [6, 4]
      - [13, 3]
      - [17, 1]
      - [27, 0]
      - [34, -1]
      - [45, -3]
      - [999, -5]

roster:
  starters:
    QB: 1
    RB: 2
    WR: 2
    TE: 1
    FLEX: 1                    # RB/WR/TE
    K: 1
    DST: 1
  flex_eligible: [RB, WR, TE]
  bench: 7                     # ESPN default
  ir: 1

draft:
  type: snake                  # snake | auction | linear
  rounds: 16                   # starters + bench (+ typical)
  my_slot: null                # set during draft setup; null = ask

waivers:
  system: faab                 # faab | priority
  faab_budget: 100

espn:
  # Non-secret league identifiers may live here; espn_s2/SWID stay in
  # C:\Users\mwill\.secrets\shared.env or config/espn.local.yaml (gitignored).
  league_id: null
  year: 2026

# ---------------------------------------------------------------------------
# The leagues you play in. Everything above is shared; an entry here overrides
# only what genuinely differs between leagues.
#
#   id                slug used in URLs and data filenames — do not rename
#                     mid-season, it keys the stored draft and roster cache
#   teams             10-12; drives VORP replacement level, so it must be right
#   draft.my_slot     your position in the snake order (1..teams), null = ask
#   espn_league_id    from the ESPN league URL (?leagueId=...) — not a secret
#
# espn_s2 / SWID come from shared.env and cover every league on that ESPN
# account. Add `espn_s2:`/`swid:` to an entry only for a league on a different
# account.
# ---------------------------------------------------------------------------
leagues:
  - id: league1
    name: "League 1"
    teams: 12
    espn_league_id: 923267
    draft: { my_slot: null, rounds: 16 }
    # Manager names by DRAFT SLOT (1..teams), not ESPN team_id -- draft slot is
    # what _team_rosters keys teams by. This is a manual override: nothing
    # in _team_rosters pulls a live team name from ESPN sync, so it applies
    # even now that espn_league_id is filled in above.
    team_names:
      - Ray
      - Marcus
      - Nate
      - Shawn
      - Paco
      - Rogerio
      - Dino
      - Taiyou
      - David
      - Rodney
      - James
      - Mike

  - id: league2
    name: "League 2"
    teams: 12
    espn_league_id: 13288034
    draft: { my_slot: null, rounds: 16 }
    # Manager names by DRAFT SLOT -- unlike league1's team_names (hand-entered
    # real names), these are the actual ESPN team nicknames, ordered via
    # etl.espn.team_slot_map(league2)'s real round-1 pick order (this league's
    # draft has already completed). Re-derive if the league resets its draft.
    team_names:
      - Bijan Mustard
      - Gibbs of Gab
      - Justin Time To Griddy
      - Dom's Daring Team
      - Emeka da Pizza 🤌🏼
      - Kittle Me Softly
      - Nightmare on Sesame Street
      - Leeroy Judkins
      - Jeanty might be a Burden
      - American Convict
      - Mock Drafting Is For Losers!
      - C-DEEZ NUTZ

  - id: league3
    name: "League 3"
    teams: 12
    espn_league_id: 146305435
    draft: { my_slot: null, rounds: 16 }

  - id: sundt
    name: "Sundt Redraft"
    platform: sleeper
    teams: 12
    playoff_week_start: 15
    sleeper_league_id: "1395500725785591808"
    # Sleeper user_id of the owner of MY roster. Stable across a commissioner
    # rebuild in a way roster_id is not; `draft.my_slot` is a DRAFT slot and is
    # NOT a roster id -- matching on it silently returns another manager's team.
    sleeper_user_id: "1396235398669176832"
    sleeper_draft_id: "1395500726964195328"
    draft: { my_slot: 10, rounds: 17 }
    waivers: { system: faab, faab_budget: 200 }
    scoring:
      passing:   { yards_per_point: 25, touchdown: 4, interception: -1, two_point: 2 }
      rushing:   { yards_per_point: 10, touchdown: 6, two_point: 2 }
      receiving: { reception: 1.0, yards_per_point: 10, touchdown: 6, two_point: 2 }
      misc:      { fumble_lost: -2, return_touchdown: 6 }
      kicking:
        fg_0_39: 3
        fg_40_49: 4
        fg_50_plus: 5
        fg_missed: -1
        xp_made: 1
        xp_missed: -1
      dst:
        sack: 1
        interception: 2
        fumble_recovery: 2
        forced_fumble: 1
        touchdown: 6
        safety: 2
        block_kick: 2
        points_allowed_tiers:
          - [0, 10]
          - [6, 7]
          - [13, 4]
          - [20, 1]
          - [27, 0]
          - [34, -1]
          - [999, -4]
    roster:
      starters: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, SUPER_FLEX: 1, K: 1, DST: 1 }
      flex_eligible: [RB, WR, TE]
      flex_slots:
        FLEX:       { eligible: [RB, WR, TE],     share: { RB: .45, WR: .45, TE: .10 } }
        SUPER_FLEX: { eligible: [QB, RB, WR, TE], share: { QB: .90, RB: .04, WR: .04, TE: .02 } }
      bench: 7
      ir: 2

# League selected when a request does not name one.
active: league1
